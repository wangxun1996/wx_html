<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挪车号码编辑</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px 48px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(180deg, #badbff 0%, #eef2ff 28%, #fdf2f8 100%);
        color: #111827;
    }

    .app {
        max-width: 560px;
        margin: 0 auto;
    }

    h1 {
        margin: 8px 0 4px;
        font-size: 24px;
        font-weight: 700;
        text-align: center;
    }

    .subtitle {
        margin: 0 0 20px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
    }

    .card {
        margin-bottom: 16px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    .card-title {
        margin-bottom: 12px;
        font-size: 13px;
        color: #6b7280;
    }

    .ipt {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        background: #fff;
        font-size: 15px;
        color: #111827;
        outline: none;
        transition: border-color 0.15s ease;
    }

    .ipt:focus {
        border-color: #7cb0e8;
    }

    .owner-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    .owner-row .name {
        flex: 0 0 34%;
    }

    .owner-row .phone {
        flex: 1;
        min-width: 0;
    }

    .owner-row .del {
        flex: 0 0 auto;
        width: 52px;
        height: 44px;
        border: none;
        border-radius: 12px;
        background: #f3f4f6;
        color: #6b7280;
        font-size: 13px;
        cursor: pointer;
    }

    .owner-row .del:hover {
        background: #fee2e2;
        color: #dc2626;
    }

    .row-actions {
        display: flex;
        gap: 10px;
        margin-top: 4px;
    }

    button {
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.05s ease;
    }

    button:active {
        transform: scale(0.98);
    }

    .btn {
        height: 44px;
        border: none;
        border-radius: 22px;
        font-size: 15px;
        font-weight: 600;
    }

    .btn-block {
        width: 100%;
    }

    .btn-ghost {
        flex: 1;
        background: #f3f4f6;
        color: #4b5563;
        font-weight: 500;
    }

    .btn-primary {
        margin-top: 4px;
        color: #fff;
        background: linear-gradient(135deg, #f26621 0%, #f7a06a 100%);
        box-shadow: 0 10px 24px rgba(242, 102, 33, 0.3);
    }

    .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .status {
        min-height: 22px;
        margin-top: 14px;
        font-size: 13px;
        text-align: center;
        color: #6b7280;
    }

    .status.ok {
        color: #059669;
    }

    .status.err {
        color: #dc2626;
    }

    .status.warn {
        color: #d97706;
    }

    .footer-note {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
    }
</style>
</head>
<body>
<div class="app">
    <h1>挪车号码编辑</h1>
    <p class="subtitle">修改后，小程序「一键挪车」自动读取</p>

    <!-- 默认号码 -->
    <section class="card">
        <div class="card-title">当前默认号码</div>
        <input id="currentPhone" class="ipt" type="tel" placeholder="输入默认号码">
    </section>

    <!-- 号码列表 -->
    <section class="card">
        <div class="card-title">号码列表</div>
        <div id="owners"></div>
        <div class="row-actions">
            <button id="addBtn" class="btn btn-ghost">＋ 添加号码</button>
            <button id="resetBtn" class="btn btn-ghost">恢复默认</button>
        </div>
    </section>

    <!-- 操作 -->
    <button id="loadBtn" class="btn btn-ghost btn-block" style="margin-bottom:10px;">重新读取</button>
    <button id="saveBtn" class="btn btn-primary btn-block">保存到</button>

    <div id="status" class="status"></div>
    <div class="footer-note">保存后小程序端刷新即可看到最新号码</div>
</div>

<script>
    const REPO = 'wangxun1996/simple-store';
    const FILE_PATH = 'phones.json';
    const API_URL = 'https://gitee.com/api/v5/repos/' + REPO + '/contents/' + FILE_PATH;
    // 内置 Token（仅本机自用）
    const TOKEN = '32be57099bf8569fa21c8c724e1e1b71';

    const DEFAULT_OWNERS = [
        { text: '王*', value: '15554420686', icon: 'user-o' },
        { text: '王**', value: '13054988786', icon: 'user-o' },
        { text: '朱*', value: '13295377360', icon: 'contact-o' },
        { text: '高*', value: '18660901224', icon: 'contact-o' }
    ];

    let owners = [];
    let currentPhone = '';
    let saving = false;

    function $(id) {
        return document.getElementById(id);
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // UTF-8 安全的 Base64 编解码（Gitee API 要求）
    function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    function base64ToUtf8(b64) {
        const binary = atob(String(b64 || '').replace(/\s/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder().decode(bytes);
    }

    function setStatus(text, type) {
        const el = $('status');
        el.textContent = text || '';
        el.className = 'status' + (type ? ' ' + type : '');
    }

    // 渲染号码列表
    function render() {
        const box = $('owners');
        box.innerHTML = owners
            .map((o, i) => {
                return (
                    '<div class="owner-row">' +
                    '<input class="ipt name" placeholder="称呼，如：王*" value="' + escapeHtml(o.text) + '" data-i="' + i + '" data-k="text">' +
                    '<input class="ipt phone" type="tel" placeholder="手机号" value="' + escapeHtml(o.value) + '" data-i="' + i + '" data-k="value">' +
                    '<button class="del" data-i="' + i + '">删除</button>' +
                    '</div>'
                );
            })
            .join('');
        $('currentPhone').value = currentPhone || '';
    }

    // 应用数据
    function applyData(data) {
        const d = data || {};
        owners = Array.isArray(d.owners) && d.owners.length
            ? d.owners.map((o) => ({ text: o.text || '', value: o.value || '', icon: o.icon || 'user-o' }))
            : DEFAULT_OWNERS.map((o) => Object.assign({}, o));
        currentPhone = d.currentPhone || (owners[0] && owners[0].value) || '';
        render();
    }

    // 读取数据
    async function load() {
        setStatus('读取中…');
        try {
            const url = API_URL + '?access_token=' + encodeURIComponent(TOKEN);
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }
            const data = await res.json();
            const content = JSON.parse(base64ToUtf8(data.content));
            applyData(content);
            setStatus('已读取最新数据', 'ok');
        } catch (e) {
            applyData(null);
            setStatus('读取失败：' + e.message + '，已显示默认数据', 'err');
        }
    }

    // 保存到 Gitee
    async function save() {
        if (saving) {
            return;
        }

        const list = owners
            .map((o) => ({ text: String(o.text || '').trim(), value: String(o.value || '').trim(), icon: o.icon || 'user-o' }))
            .filter((o) => o.text && o.value);
        if (!list.length) {
            setStatus('至少填写一条有效号码', 'err');
            return;
        }
        const current = String($('currentPhone').value || '').trim() || list[0].value;
        const payload = JSON.stringify({ owners: list, currentPhone: current }, null, 4);

        saving = true;
        $('saveBtn').disabled = true;
        setStatus('保存中…');
        try {
            // 先取 sha（更新已有文件必须带）
            let curSha = '';
            const getRes = await fetch(API_URL + '?access_token=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
            if (getRes.ok) {
                const d = await getRes.json();
                curSha = d.sha || '';
            }

            const body = {
                access_token: TOKEN,
                message: 'update phones.json from html editor',
                content: utf8ToBase64(payload)
            };
            if (curSha) {
                body.sha = curSha;
            }

            const putRes = await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (putRes.ok) {
                owners = list;
                currentPhone = current;
                render();
                setStatus('保存成功', 'ok');
            } else {
                const errText = await putRes.text();
                setStatus('保存失败：' + errText.slice(0, 160), 'err');
            }
        } catch (e) {
            setStatus('保存失败：' + e.message, 'err');
        } finally {
            saving = false;
            $('saveBtn').disabled = false;
        }
    }

    // 事件绑定
    document.addEventListener('DOMContentLoaded', function () {
        // 列表输入
        document.getElementById('owners').addEventListener('input', function (e) {
            const target = e.target;
            if (!target.dataset || target.dataset.i === undefined) {
                return;
            }
            const index = Number(target.dataset.i);
            const key = target.dataset.k;
            if (owners[index]) {
                owners[index][key] = target.value;
            }
        });

        // 删除
        document.getElementById('owners').addEventListener('click', function (e) {
            const target = e.target;
            if (target.classList.contains('del')) {
                const index = Number(target.dataset.i);
                owners.splice(index, 1);
                render();
            }
        });

        $('addBtn').addEventListener('click', function () {
            owners.push({ text: '', value: '', icon: 'user-o' });
            render();
        });

        $('resetBtn').addEventListener('click', function () {
            owners = DEFAULT_OWNERS.map((o) => Object.assign({}, o));
            currentPhone = DEFAULT_OWNERS[0].value;
            render();
            setStatus('已恢复默认数据（未保存）', 'warn');
        });

        $('loadBtn').addEventListener('click', load);
        $('saveBtn').addEventListener('click', save);

        // 打开页面自动读取
        load();
    });
</script>
</body>
</html>
